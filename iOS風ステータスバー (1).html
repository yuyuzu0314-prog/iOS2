<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iOS風ステータスバー</title>
<style>
:root{--bg:#f2f2f5;--fg:#111;--card:#fff;--bd:#d0d0d8;--dy:1px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16161a;--fg:#eee;--card:#26262c;--bd:#40404a}}
:root[data-theme="dark"]{--bg:#16161a;--fg:#eee;--card:#26262c;--bd:#40404a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px}
.phone{position:relative;width:100%;max-width:390px;height:500px;border-radius:44px;border:6px solid #111;overflow:hidden;background:linear-gradient(160deg,#1a7fc0,#1c9a86 65%,#1e8f7a)}
.sb{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:6px 22px 0;color:#fff;background:transparent;z-index:2}
.sb .l,.sb .r{display:flex;align-items:center;gap:5px;min-width:0}
.sb .l{flex:1}.sb .r{flex:none}
.clock{font-weight:var(--cw,600);-webkit-text-stroke:var(--cst,0px) currentColor;font-size:16px;letter-spacing:.2px}
.ni{width:15px;height:15px;border-radius:50%;font-size:8px;display:grid;place-items:center;font-weight:700;flex:none}
.more{font-size:11px;font-weight:600}
svg.i{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.net{font-size:13px;font-weight:var(--cw,600);-webkit-text-stroke:var(--cst,0px) currentColor}
.bat{display:flex;align-items:center;flex:none}
.sb .r{gap:0}
.sl{display:inline-flex;max-width:0;margin-left:0;opacity:0;transform:scale(.3);overflow:hidden;transition:max-width .35s,margin-left .35s,opacity .3s,transform .45s cubic-bezier(.3,1.6,.5,1)}
.sl.on{max-width:30px;margin-left:5px;opacity:1;transform:none}
#s-vib.on svg{animation:vb .5s}
@keyframes vb{20%{transform:translateX(-2px) rotate(-8deg)}40%{transform:translateX(2px) rotate(8deg)}60%{transform:translateX(-1px)}}
.bat{margin-left:5px}
.pill{position:relative;width:32px;height:17px;border-radius:6px;background:rgba(150,150,156,.7);overflow:hidden;display:flex;align-items:center;justify-content:center;color:#2a2a2d;font-weight:700;font-size:12px;line-height:1;font-variant-numeric:tabular-nums}
.pill .fl{position:absolute;left:0;top:0;bottom:0;width:96%;background:#fff;transition:width .6s cubic-bezier(.3,.9,.3,1),background .3s}
.pill.chg .fl{background:#30d158}.pill.low .fl{background:#ff453a}
.pill.chg .fl::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:sh 1.6s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.pn{position:relative;transform:translateY(var(--dy));font-weight:var(--nw,700);letter-spacing:var(--nls,0px);margin-right:calc(var(--nls,0px)*-1);font-size:var(--nfs,12px);-webkit-text-stroke:var(--nst,0px) currentColor}
.ni.new{animation:nin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes nin{from{transform:scale(0)}}
.phone{background-size:200% 200%;animation:bg 14s ease infinite}
@keyframes bg{50%{background-position:100% 100%}}
.sheet.show .art svg{animation:artIn .7s .2s cubic-bezier(.2,1.2,.3,1) both}
.sheet.show h2{animation:up .5s .3s both}.sheet.show .sub{animation:up .5s .4s both}
@keyframes artIn{from{opacity:0;transform:translateY(24px) scale(.85)}}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.btn{transition:background .3s,transform .15s}.btn:active{transform:scale(.97)}
.btn.done{animation:bump .4s}@keyframes bump{40%{transform:scale(1.05)}}
button.c:active{transform:scale(.96)}
.nub{width:2px;height:6px;background:#fff;opacity:.6;border-radius:0 2px 2px 0;margin-left:1px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .35s;z-index:4}
.dim.show{opacity:1}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;border-radius:38px;padding:14px 22px 20px;color:#111;text-align:center;z-index:5;
 background:rgba(246,246,248,.88);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border:1px solid rgba(255,255,255,.6);
 transform:translateY(120%);transition:transform .55s cubic-bezier(.2,.9,.25,1.05)}
.sheet.show{transform:translateY(0)}
.art{height:170px;display:grid;place-items:center;position:relative;width:100%}.art svg{height:112px;width:auto}#gl{position:absolute;inset:0;width:100%;height:100%}
.sheet.show #gl{animation:fin .5s .15s both}@keyframes fin{from{opacity:0}}
.sheet h2{margin:6px 0 2px;font-size:21px;font-weight:700}
.sub{font-size:13px;color:#6b6b73;min-height:18px}
.bats{margin:12px 0 0;display:flex;justify-content:center;gap:44px;opacity:0;transition:opacity .4s;height:62px}
.bats.show{opacity:1}
.bc{display:flex;flex-direction:column;align-items:center;gap:6px}
.bc .lb{font-size:12px;color:#6b6b73;line-height:1}
.bo{display:flex;align-items:center}
.bo b{display:block;width:46px;height:22px;border:2px solid rgba(0,0,0,.4);border-radius:7px;padding:2px}
.bo b i{display:block;height:100%;background:#000;border-radius:4px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bo s{width:2.5px;height:8px;background:rgba(0,0,0,.4);border-radius:0 2px 2px 0;margin-left:1.5px}
.bc .pc{font-size:14px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.btn{margin-top:14px;width:100%;height:50px;border-radius:25px;border:0;background:#0a84ff;color:#fff;font-size:17px;font-weight:600;display:grid;place-items:center}
.btn.done{background:rgba(0,0,0,.08);color:#111}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.ctl{width:100%;max-width:390px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl h3{width:100%;margin:6px 0 0;font-size:12px;color:#888;font-weight:600}
.ctl label{font-size:13px;display:flex;align-items:center;gap:6px}
button.c,select,input[type=text]{font:inherit;font-size:13px;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
input[type=text]{flex:1;min-width:120px}
input[type=range]{flex:1;min-width:110px}
.sb{font-family:var(--ff,inherit)}
.app,.app body{background:transparent}.app body{padding:0;display:block}.app .ctl,.app .sb,.app .dim{display:none}
.app .phone{position:fixed;inset:0;max-width:none;width:auto;height:auto;border:0;border-radius:0;background:none;animation:none}.app .sheet{bottom:24px}
</style>
</head>
<body>
<div class="phone">
  <div class="sb">
    <div class="l"><span class="clock" id="clock">9:41</span><span id="nots" style="display:flex;gap:3px;align-items:center"></span></div>
    <div class="r" id="right">
      <span class="sl" id="s-vib"></span><span class="sl" id="s-mute"></span><span class="sl" id="s-bt"></span>
      <span class="sl on" id="s-sig"></span><span class="sl" id="s-net"><span class="net" id="netT">5G</span></span><span class="sl" id="s-wifi"></span>
      <span class="bat"><span class="pill" id="pill"><i class="fl" id="fl"></i><span class="pn" id="pn">96</span></span><span class="nub"></span></span>
    </div>
  </div>
  <div class="dim" id="dim"></div>
  <div class="sheet" id="sheet">
    <div class="art" id="art"><canvas id="gl"></canvas><div id="flat"></div></div>
    <h2 id="ttl"></h2>
    <div class="sub" id="sub"></div>
    <div class="bats" id="bats">
      <div class="bc" id="bce"><span class="lb">イヤホン</span><div class="bo"><b><i id="fe"></i></b><s></s></div><span class="pc" id="ve"></span></div>
      <div class="bc" id="bcc"><span class="lb">ケース</span><div class="bo"><b><i id="fc"></i></b><s></s></div><span class="pc" id="vc"></span></div>
    </div>
    <button class="btn" id="btn">接続</button>
  </div>
</div>

<div class="ctl">
  <h3>本体</h3>
  <label style="width:100%">バッテリー <input type="range" id="lvl" min="1" max="100" value="96"><span id="lvlV">96</span></label>
  <label style="width:100%">数字の上下位置 <input type="range" id="dy" min="-2" max="4" step="0.5" value="1"><span id="dyV">1</span></label>
  <label style="width:100%">数字の太さ <input type="range" id="nw" min="100" max="900" step="50" value="700"><span id="nwV">700</span></label>
  <label style="width:100%">数字の間隔 <input type="range" id="nls" min="-1.5" max="2" step="0.1" value="0"><span id="nlsV">0</span></label>
  <label style="width:100%">数字の大きさ <input type="range" id="nfs" min="9" max="15" step="0.5" value="12"><span id="nfsV">12</span></label>
  <label style="width:100%">数字の縁取り(さらに太く) <input type="range" id="nst" min="0" max="1.2" step="0.1" value="0"><span id="nstV">0</span></label>
  <label style="width:100%">時計の太さ <input type="range" id="cw" min="100" max="900" step="50" value="600"><span id="cwV">600</span></label>
  <label style="width:100%">時計の縁取り <input type="range" id="cst" min="0" max="1.2" step="0.1" value="0"><span id="cstV">0</span></label>
  <label>フォント <select id="ff"><option value="inherit">標準</option><option value="ui-rounded,'SF Pro Rounded',sans-serif">丸ゴシック</option><option value="Roboto,Arial,sans-serif">Roboto</option><option value="ui-monospace,monospace">等幅</option></select></label>
  <label><input type="checkbox" id="chg">充電中</label>
  <select id="mode"><option value="normal">通常</option><option value="vib">バイブ</option><option value="mute">サイレント</option></select>
  <select id="net"><option value="5G">5G</option><option value="LTE">LTE</option><option value="wifi">Wi-Fi</option></select>
    <h3>通知</h3>
  <select id="napp"><option>メッセージ</option><option>メール</option><option>カレンダー</option><option>ニュース</option></select>
  <button class="c" id="send">通知を送る</button><button class="c" id="clrN">通知クリア</button>
  <h3>イヤホン</h3>
  <select id="shape"><option value="air">AirPods型</option><option value="daiso">丸型(3Dモデル)</option></select>
  <input type="text" id="dn" value="ワイヤレスイヤホン" placeholder="イヤホンの名前">
  <label style="width:100%">イヤホン残量 <input type="range" id="ear" min="1" max="100" value="85"><span id="earV">85</span></label>
  <label style="width:100%">ケース残量 <input type="range" id="cas" min="1" max="100" value="60"><span id="casV">60</span></label>
  <button class="c" id="btBtn">Bluetooth接続</button><button class="c" id="wrBtn">有線イヤホン接続</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const P={
 bt:'<svg class="i" viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg>',
 vib:'<svg class="i" viewBox="0 0 24 24"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4.5 8v8M19.5 8v8M1.5 10v4M22.5 10v4"/></svg>',
 mute:'<svg class="i" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M3 3l18 18"/></svg>',
 wifi:'<svg class="i" viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="#fff"/></svg>'
};
const DAISO='<svg viewBox="0 0 210 110"><defs><linearGradient id="cb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#55555c"/><stop offset="1" stop-color="#26262a"/></linearGradient><linearGradient id="bt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a9aa0"/><stop offset="1" stop-color="#5a5a60"/></linearGradient></defs>'
+'<rect x="14" y="6" width="100" height="48" rx="16" fill="#3a3a40"/><rect x="6" y="40" width="116" height="62" rx="18" fill="url(#cb)"/>'
+'<ellipse cx="38" cy="66" rx="17" ry="11" fill="#141417"/><ellipse cx="90" cy="66" rx="17" ry="11" fill="#141417"/><circle cx="60" cy="62" r="2" fill="#c9a24a"/><circle cx="64" cy="62" r="2" fill="#c9a24a"/><rect x="48" y="86" width="26" height="4" rx="2" fill="#17171a"/>'
+'<ellipse cx="164" cy="64" rx="28" ry="24" fill="#202023"/><ellipse cx="164" cy="64" rx="28" ry="24" fill="none" stroke="#3a3a40" stroke-width="2"/><circle cx="162" cy="66" r="16" fill="url(#bt)" stroke="#6a6a70" stroke-width="2"/><circle cx="146" cy="48" r="2.6" fill="#3b82f6"/>'
+'<ellipse cx="190" cy="44" rx="11" ry="9" transform="rotate(-25 190 44)" fill="#2c2c30"/></svg>';
const SIG='<svg viewBox="0 0 18 14" style="width:18px;height:14px;fill:#fff"><rect x="0" y="9" width="3.4" height="5" rx="1.2"/><rect x="5" y="6" width="3.4" height="8" rx="1.2"/><rect x="10" y="3" width="3.4" height="11" rx="1.2"/><rect x="15" y="0" width="3" height="14" rx="1.2"/></svg>';
const HEAD='<svg viewBox="0 0 24 24" style="height:90px" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><path d="M4 14h3v6H4zM17 14h3v6h-3z"/></svg>';
const S={lvl:96,chg:false,mode:'normal',net:'5G',nots:[],btOn:false,ear:85,cas:60};
const APPS={'メッセージ':['#34c759','M'],'メール':['#0a84ff','@'],'カレンダー':['#ff3b30','31'],'ニュース':['#ff2d55','N']};

function render(){
 const t=(id,on)=>$(id).classList.toggle('on',on);
 t('s-vib',S.mode==='vib');t('s-mute',S.mode==='mute');t('s-bt',S.btOn);
 t('s-wifi',S.net==='wifi');t('s-net',S.net!=='wifi');
 if(S.net!=='wifi')$('netT').textContent=S.net;
 const p=$('pill');p.classList.toggle('chg',S.chg);p.classList.toggle('low',!S.chg&&S.lvl<=20);
 $('fl').style.width=S.lvl+'%';$('pn').textContent=S.lvl;
 renderNots(false);
}
function renderNots(nw){
 const a=S.nots.slice(-3);
 $('nots').innerHTML=a.map((n,i)=>'<span class="ni'+(nw&&i===a.length-1?' new':'')+'" style="background:'+n.c+'">'+n.g+'</span>').join('')+(S.nots.length>3?'<span class="more">+'+(S.nots.length-3)+'</span>':'');
}
function tick(){const d=new Date();$('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
tick();setInterval(tick,10000);

/* 通知: ステータスバーのアイコンのみ */
function notify(app){const a=APPS[app]||['#8e8e93','?'];S.nots.push({c:a[0],g:a[1]});renderNots(true)}


/* イヤホン */
let T=[];
function clr(){T.forEach(clearTimeout);T=[]}
function close(){clr();$('sheet').classList.remove('show');$('dim').classList.remove('show');try{if(window.Android)Android.closed()}catch(e){}setTimeout(()=>{if(G&&!$('sheet').classList.contains('show'))G.stop()},700)}
function fill(){
 $('bce').style.display=S.ear<0?'none':'';$('bcc').style.display=S.cas<0?'none':'';
 $('ve').textContent=S.ear+'%';$('vc').textContent=S.cas+'%';
 $('fe').style.width='0';$('fc').style.width='0';
 requestAnimationFrame(()=>requestAnimationFrame(()=>{$('fe').style.width=S.ear+'%';$('fc').style.width=S.cas+'%'}));
}
function name(){return $('dn').value.trim()||'イヤホン'}
function connect(art,title,withBats){
 clr();
 showArt(art);$('ttl').textContent=title;$('sub').textContent='';
 $('bats').classList.remove('show');
 const b=$('btn');b.className='btn';b.textContent='接続';
 $('sheet').classList.add('show');$('dim').classList.add('show');
 const go=()=>{clr();b.innerHTML='<div class="spin"></div>';
  T.push(setTimeout(()=>{
   b.className='btn done';b.textContent='完了';
   $('sub').textContent=withBats?'接続されました':'有線で接続されました';
   if(withBats&&(S.ear>=0||S.cas>=0)){$('bats').classList.add('show');fill()}
   S.btOn=withBats;render();if(withBats&&G)G.bump();
   T.push(setTimeout(close,5000));
  },1100));
 };
 b.onclick=()=>{if(b.className==='btn')go();else close()};
 T.push(setTimeout(go,1800));
}
$('dim').onclick=close;
$('lvl').oninput=e=>{S.lvl=+e.target.value;$('lvlV').textContent=S.lvl;render()};
$('dy').oninput=e=>{document.documentElement.style.setProperty('--dy',e.target.value+'px');$('dyV').textContent=e.target.value};
$('ear').oninput=e=>{S.ear=+e.target.value;$('earV').textContent=S.ear};
$('cas').oninput=e=>{S.cas=+e.target.value;$('casV').textContent=S.cas};
$('chg').onchange=e=>{S.chg=e.target.checked;render()};
$('mode').onchange=e=>{S.mode=e.target.value;render()};
$('net').onchange=e=>{S.net=e.target.value;render()};
$('send').onclick=()=>notify($('napp').value);
$('clrN').onclick=()=>{S.nots=[];render()};
$('btBtn').onclick=()=>{S.btOn=false;render();connect(null,name(),true)};

   const sh=new T.Mesh(new T.PlaneGeometry(size.x*1.25,size.z*1.1),new T.MeshBasicMaterial({map:tx,transparent:true,depthWrite:false}));
   sh.rotation.x=-Math.PI/2;sh.position.y=-size.y/2-.03;piv.add(sh);piv.visible=false;sc.add(piv);
   return{piv,sg,size,zoom:zoom||1};
  }
  /* --- 丸型(GLB) --- */
  {
   const raw=atob(GLB),u8=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)u8[i]=raw.charCodeAt(i);
   const dv=new DataView(u8.buffer),jl=dv.getUint32(12,true);
   const J=JSON.parse(new TextDecoder().decode(u8.subarray(20,20+jl))),base=20+jl+8;
   const rd=i=>{const a=J.accessors[i],bv=J.bufferViews[a.bufferView],n={SCALAR:1,VEC3:3,VEC4:4}[a.type],C={5126:Float32Array,5123:Uint16Array,5125:Uint32Array,5121:Uint8Array}[a.componentType],o=base+(bv.byteOffset||0)+(a.byteOffset||0);return{d:new C(u8.buffer.slice(o,o+a.count*n*C.BYTES_PER_ELEMENT)),n}};
   const model=new T.Group();model.rotation.x=-Math.PI/2;
   const lidP=new T.Group(),lid=new T.Group(),earL=new T.Group(),earR=new T.Group(),loose=new T.Group(),looseIn=new T.Group();
   const LC=new T.Vector3(-3.15,-0.35,0.62);
   lidP.position.set(0,LID_K[0],LID_K[1]);lid.position.set(0,-LID_K[0],-LID_K[1]);lidP.add(lid);
   loose.position.copy(LC);looseIn.position.copy(LC).multiplyScalar(-1);loose.add(looseIn);
   model.add(lidP,earL,earR,loose);
   let led=null;
   J.meshes.forEach((m,i)=>{
    const p=m.primitives[0],P=rd(p.attributes.POSITION),Cc=rd(p.attributes.COLOR_0),I=rd(p.indices);
    const g=new T.BufferGeometry(),col=new Float32Array(P.d.length);
    for(let k=0;k<P.d.length/3;k++)for(let c=0;c<3;c++)col[k*3+c]=Cc.d[k*Cc.n+c]/255;
    g.setAttribute('position',new T.BufferAttribute(P.d,3));g.setAttribute('color',new T.BufferAttribute(col,3));
    g.setIndex(new T.BufferAttribute(I.d,1));g.computeVertexNormals();
    const smooth=[3,4,5,8,9,10,18,19,20,21].includes(i);
    const o={vertexColors:true,flatShading:!smooth,roughness:.55,metalness:.12};
    if([3,8,18].includes(i)){o.roughness=.22;o.metalness=.25}
    if([4,9,19].includes(i)){o.roughness=.3;o.metalness=.6}
    if([5,10,20].includes(i)){o.roughness=.9;o.metalness=0}
    if([6,7,11,12].includes(i)){o.roughness=.3;o.metalness=.9}
    const mat=new T.MeshStandardMaterial(o);
    if(i===21){mat.emissive=new T.Color(0x3b82f6);led=mat}
    const mesh=new T.Mesh(g,mat);
    (i===15||i===16?lid:[3,4,5].includes(i)?earL:[8,9,10].includes(i)?earR:[18,19,20,21].includes(i)?looseIn:model).add(mesh);
   });
   const R=finish(model,1);
   R.anim=t=>{
    lidP.rotation.x=.3*(1-ob(t/1.2))*LID_A;
    const pk=(t-.6)/.9,lift=pk>0&&pk<1?.2*Math.sin(pk*Math.PI):0;earL.position.z=lift;earR.position.z=lift;
    loose.position.z=LC.z+.12*Math.sin(t*1.7);loose.rotation.z=.28*Math.sin(t);
    if(led)led.emissiveIntensity=.5+.9*(.5+.5*Math.sin(t*4));
   };
   rigs.daiso=R;
  }
  /* --- AirPods型 --- */
  {
   const W=2.7,D=2.0,BH=.65,LH=.35,RAD=.8,OA=105*Math.PI/180;
   const rr=(w,h,rad)=>{const s=new T.Shape(),x=-w/2,y=-h/2;s.moveTo(x+rad,y);s.lineTo(x+w-rad,y);s.absarc(x+w-rad,y+rad,rad,-Math.PI/2,0,false);s.lineTo(x+w,y+h-rad);s.absarc(x+w-rad,y+h-rad,rad,0,Math.PI/2,false);s.lineTo(x+rad,y+h);s.absarc(x+rad,y+h-rad,rad,Math.PI/2,Math.PI,false);s.lineTo(x,y+rad);s.absarc(x+rad,y+rad,rad,Math.PI,Math.PI*1.5,false);return s};
   const slab=(h,mat)=>{const g=new T.ExtrudeGeometry(rr(W-.24,D-.24,RAD-.12),{depth:h-.24,bevelEnabled:true,bevelThickness:.12,bevelSize:.12,bevelSegments:5,curveSegments:28});g.rotateX(-Math.PI/2);const m=new T.Mesh(g,mat);m.position.y=.12;return m};
   const white=new T.MeshStandardMaterial({color:0xf3f3f5,roughness:.28,metalness:.04});
   const gray=new T.MeshStandardMaterial({color:0xc4c4ca,roughness:.4,metalness:.3});
   const model=new T.Group();
   model.add(slab(BH,white));
   const lidP=new T.Group();lidP.position.set(0,BH,-D/2);const lm=slab(LH,white);lm.position.z=D/2;lidP.add(lm);model.add(lidP);
   const hg=new T.Mesh(new T.CylinderGeometry(.09,.09,1.4,20),gray);hg.rotation.z=Math.PI/2;hg.position.set(0,BH,-D/2+.04);model.add(hg);
   const mkBud=x=>{
    const g=new T.Group(),sg=-Math.sign(x);
    const head=new T.Mesh(new T.SphereGeometry(.34,32,24),white);head.scale.set(1,1.15,.95);head.position.y=.22;g.add(head);
    const stem=new T.Mesh(new T.CylinderGeometry(.09,.12,1.0,20),white);stem.position.y=-.3;g.add(stem);
    const tip=new T.Mesh(new T.SphereGeometry(.14,16,12),gray);tip.position.set(sg*.3,.1,.05);g.add(tip);
    const well=new T.Mesh(new T.CircleGeometry(.43,32),new T.MeshBasicMaterial({color:0x2b2b31}));well.rotation.x=-Math.PI/2;well.position.set(x,BH+.004,.15);model.add(well);
    g.position.set(x,BH,.15);model.add(g);return g;
   };
   const bL=mkBud(-.62),bR=mkBud(.62);
   const ledm=new T.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:.6});
   const led=new T.Mesh(new T.SphereGeometry(.05,12,8),ledm);led.position.set(0,BH*.55,D/2+.01);model.add(led);
   lidP.rotation.x=-OA;
   const R=finish(model,.85);
   R.anim=t=>{
    lidP.rotation.x=-(.5+.5*ob(t/1.1))*OA;
    const pk=(t-.6)/.9,lift=pk>0&&pk<1?.45*Math.sin(pk*Math.PI):0;
    bL.position.y=BH+lift;bR.position.y=BH+lift;bL.rotation.z=.12+lift*.25;bR.rotation.z=-.12-lift*.25;
    ledm.emissiveIntensity=.4+.9*(.5+.5*Math.sin(t*4));R.piv.position.y=.04*Math.sin(t*1.3);
   };
   rigs.air=R;
  }
  const st={raf:0,t0:0,tb:-1e9,cur:'air'};
  function fit(){
   const R=rigs[st.cur],size=R.size,w=cv.clientWidth||300,h=cv.clientHeight||170;r.setSize(w,h,false);cam.aspect=w/h;
   const th=Math.tan(cam.fov*Math.PI/360),dw=size.x*1.18/(2*th*cam.aspect),dh=(size.y+size.z*.4)*1.08/(2*th),d=Math.max(dw,dh)*R.zoom,el=.5;
   cam.position.set(0,d*Math.sin(el),d*Math.cos(el));cam.lookAt(0,0,0);cam.updateProjectionMatrix();
  }
  function frame(now){
   const t=(now-st.t0)/1000,R=rigs[st.cur];
   const bp=(now-st.tb)/700,b=bp>=0&&bp<1?1+.08*Math.sin(bp*Math.PI):1;
   R.sg.scale.setScalar((.72+.28*ob(t/.9))*b);
   R.piv.rotation.y=-.7*(1-oc(t/1.5))+.28*Math.sin(t*.8);R.piv.rotation.x=.05*Math.sin(t*.6);
   R.anim(t);r.render(sc,cam);
  }
  return{
   set(k){st.cur=rigs[k]?k:'air';for(const n in rigs)rigs[n].piv.visible=(n===st.cur)},
   start(){st.t0=performance.now();fit();cancelAnimationFrame(st.raf);const loop=n=>{frame(n);st.raf=requestAnimationFrame(loop)};st.raf=requestAnimationFrame(loop)},
   stop(){cancelAnimationFrame(st.raf)},
   bump(){st.tb=performance.now()}
  };
 }catch(e){return null}
}
